<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags -->
    <title>TrackFlow — E-Commerce Logistics &amp; Warehouse Management | US &amp; Spain</title>
    <meta name="description" content="TrackFlow gives growing commerce brands the clarity and control to move every order from warehouse shelf to customer door. Warehouse management, last-mile deliveries, and reverse logistics across the United States and Spain." />
    <meta name="keywords" content="e-commerce logistics, warehouse management, last-mile delivery, reverse logistics, 3PL, fulfillment, US Spain logistics, TrackFlow" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://trackflow.com/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trackflow.com/" />
    <meta property="og:title" content="TrackFlow — E-Commerce Logistics &amp; Warehouse Management | US &amp; Spain" />
    <meta property="og:description" content="Warehouse management, last-mile deliveries, and reverse logistics in the United States and Spain. Over 15 years helping e-commerce brands grow." />
    <meta property="og:site_name" content="TrackFlow" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrackFlow — E-Commerce Logistics &amp; Warehouse Management" />
    <meta name="twitter:description" content="Warehouse management, last-mile deliveries, and reverse logistics in the US and Spain. Over 15 years helping e-commerce brands grow." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TrackFlow",
        "description": "Warehouse management and last-mile deliveries for e-commerce companies in the United States and Spain.",
        "url": "https://trackflow.com",
        "foundingDate": "2009",
        "numberOfEmployees": { "@type": "QuantitativeValue", "value": "130" },
        "foundingLocation": { "@type": "Place", "address": { "@type": "PostalAddress", "addressLocality": "Los Angeles", "addressRegion": "California", "addressCountry": "US" } },
        "address": [
          {
            "@type": "PostalAddress",
            "addressCountry": "US",
            "addressLocality": "Los Angeles",
            "addressRegion": "California"
          },
          {
            "@type": "PostalAddress",
            "addressCountry": "ES",
            "addressLocality": "Zaragoza",
            "addressRegion": "Aragón"
          }
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+1-213-555-0147",
          "contactType": "sales",
          "availableLanguage": ["Spanish", "English"]
        },
        "sameAs": ["https://linkedin.com/company/trackflow"],
        "areaServed": [
          { "@type": "Country", "name": "United States" },
          { "@type": "Country", "name": "Spain" }
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TrackFlow",
        "url": "https://trackflow.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://trackflow.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "TrackFlow Services",
        "description": "Logistics services for e-commerce brands",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "Service",
              "name": "Warehouse Management",
              "description": "Storage, picking and packing with real-time inventory. Warehouses in Los Angeles and Zaragoza.",
              "provider": { "@type": "Organization", "name": "TrackFlow" },
              "areaServed": ["United States", "Spain"]
            }
          },
          {
            "@type": "ListItem",
            "position": 2,
            "item": {
              "@type": "Service",
              "name": "Last-Mile Deliveries",
              "description": "Certified carrier network in both countries with unified shipment tracking.",
              "provider": { "@type": "Organization", "name": "TrackFlow" },
              "areaServed": ["United States", "Spain"]
            }
          },
          {
            "@type": "ListItem",
            "position": 3,
            "item": {
              "@type": "Service",
              "name": "Reverse Logistics",
              "description": "Complete returns management, inspection, reconditioning, and platform integration.",
              "provider": { "@type": "Organization", "name": "TrackFlow" },
              "areaServed": ["United States", "Spain"]
            }
          }
        ]
      }
    </script>

    <!-- FAQ Schema for GEO / AI search visibility -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What logistics services does TrackFlow offer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TrackFlow offers warehouse management, last-mile deliveries, and reverse logistics for e-commerce brands operating in the United States and Spain."
            }
          },
          {
            "@type": "Question",
            "name": "Where are TrackFlow warehouses located?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TrackFlow operates warehouses in Los Angeles, California (United States) and Zaragoza, Aragón (Spain), providing binational coverage."
            }
          },
          {
            "@type": "Question",
            "name": "Which industries does TrackFlow serve?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TrackFlow specializes in fashion, electronics, and cosmetics e-commerce brands, with over 15 years of industry experience."
            }
          },
          {
            "@type": "Question",
            "name": "Does TrackFlow handle returns management?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, TrackFlow provides complete reverse logistics including returns management, inspection, reconditioning, and integration with your sales platform."
            }
          }
        ]
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
